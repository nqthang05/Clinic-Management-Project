spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/clinic_management?useUnicode=true&characterEncoding=UTF-8"
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none # KHÔNG để update, giữ nguyên cấu trúc DB của bạn
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080